<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="agent-cron icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101A2E"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D8CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8EFFC"/>
      <stop offset="1" stop-color="#9BE7FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#1D2A44" stroke-width="1"/>

  <!-- Clock ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round"/>

  <!-- Hour ticks (radius 110-130, every 45°) -->
  <g stroke="#3B4A66" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="126" x2="256" y2="146"/>
    <line x1="347.9" y1="164.1" x2="333.8" y2="178.2"/>
    <line x1="386" y1="256" x2="366" y2="256"/>
    <line x1="347.9" y1="347.9" x2="333.8" y2="333.8"/>
    <line x1="256" y1="386" x2="256" y2="366"/>
    <line x1="164.1" y1="347.9" x2="178.2" y2="333.8"/>
    <line x1="126" y1="256" x2="146" y2="256"/>
    <line x1="164.1" y1="164.1" x2="178.2" y2="178.2"/>
  </g>

  <!-- Hands at 10:10 (symmetric about 12); the minute hand ends in a terminal cursor block -->
  <g stroke="url(#hand)" stroke-linecap="round">
    <!-- Hour hand, pointing to 10 -->
    <line x1="256" y1="256" x2="188.8" y2="208.9" stroke-width="22"/>
    <!-- Minute hand, pointing to 2 -->
    <line x1="256" y1="256" x2="337.9" y2="198.8" stroke-width="16"/>
  </g>
  <!-- Terminal cursor at the minute-hand tip -->
  <rect x="320.9" y="181.8" width="34" height="34" rx="7" fill="#22D3EE"/>

  <!-- Center pin -->
  <circle cx="256" cy="256" r="17" fill="#E8EFFC"/>

  <!-- "Due" badge on the ring -->
  <g filter="url(#glow)">
    <circle cx="374.6" cy="118.2" r="21" fill="#34D399"/>
  </g>
</svg>
